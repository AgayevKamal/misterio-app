<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil — Misterio</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎁</text></svg>">
</head>
<body>
<header class="hdr">
  <a class="logo" href="index.html">
    <svg width="38" height="38" viewBox="0 0 48 48" aria-hidden="true">
      <defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff5f6d"/><stop offset="1" stop-color="#7b2ff7"/>
      </linearGradient></defs>
      <circle cx="24" cy="24" r="21" fill="url(#lg2)"/>
      <circle cx="24" cy="24" r="21" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="6 5"/>
      <path d="M24 9 L28 20 L39 20 L30 27 L33 38 L24 31 L15 38 L18 27 L9 20 L20 20 Z" fill="#fff" fill-opacity=".95"/>
      <circle cx="24" cy="24" r="4" fill="#7b2ff7"/>
    </svg>
    <span class="logo-txt">Misterio</span>
  </a>
  <a class="avatar" href="profile.html" title="Profil">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
    </svg>
  </a>
</header>

<main>
  <section class="wrap">
    <h2 class="sec-title">Profil məlumatları</h2>
    <form class="card form" id="profForm">
      <label>Ad Soyad<input id="pName" placeholder="Adınız"></label>
      <label>Email<input id="pEmail" type="email" placeholder="siz@mail.com"></label>
      <label>Telefon<input id="pPhone" placeholder="+994 __ ___ __ __"></label>
      <label>Şəhər<input id="pCity" placeholder="Bakı"></label>
      <button class="btn" type="submit">Yadda saxla</button>
      <span class="saved hidden" id="saved">✓ Yadda saxlanıldı</span>
    </form>
  </section>

  <section class="wrap">
    <h2 class="sec-title">Kuponlarım</h2>
    <div id="coupons" class="coupons"></div>
  </section>
</main>

<div class="modal hidden" id="cModal">
  <div class="modal-card">
    <h3 id="cTitle"></h3>
    <p class="win" id="cDisc"></p>
    <div class="code" id="cCode"></div>
    <ul class="terms" id="cTerms"></ul>
    <div class="row">
      <button class="btn ghost" id="cDismiss">Geri</button>
      <button class="btn danger" id="cClose">Bağla (kuponu sil)</button>
    </div>
  </div>
</div>

<footer class="ftr">
  <div class="ftr-logo">Misterio</div>
  <div>info@misterio.az · +994 50 418 27 63</div>
  <div class="small">Bütün hüquqlar qorunur © 2026 Misterio</div>
</footer>
<script src="app.js"></script>
</body>
</html>
