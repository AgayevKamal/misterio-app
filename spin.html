<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çarx — Misterio</title>
<script src="theme.js"></script>
<script src="analytics.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎁</text></svg>">
</head>
<body>
<header class="hdr">
  <a class="logo" href="index.html">
    <img src="logo/logo-misterio.svg" alt="Misterio" class="logo-img" width="38" height="38">
    <span class="logo-txt">Misterio</span>
  </a>
  <nav class="nav"><a href="pricing.html">Qiymət</a><a href="add-company.html">Şirkət əlavə et</a></nav>
  <button class="theme-btn" onclick="toggleTheme()" aria-label="Tema">☀️</button>
  <a class="avatar" href="profile.html" title="Profil">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
  </a>
</header>

<main>
  <section class="wrap">
    <div class="welcome" id="welcome"></div>

    <!-- abunəlik yoxdursa / limit bitibsə -->
    <div class="block-box hidden" id="blockBox">
      <div class="bb-ic" id="bbIc">🔒</div>
      <h2 id="bbTitle"></h2>
      <p id="bbText"></p>
      <a class="btn big" id="bbBtn" href="pricing.html">Abunə ol — 9.90 AZN/ay</a>
    </div>

    <div id="spinArea">
      <h2 class="sec-title">1. Kateqoriya seç</h2>
      <div id="cats" class="cats"></div>
    </div>
  </section>

  <section class="wrap wheel-sec" id="wheelSec">
    <h2 class="sec-title" id="wheelTitle">2. Çarxı fırlat</h2>
    <div class="wheel-box">
      <div class="pointer"></div>
      <div class="wheel-outer"><canvas id="wheel" width="520" height="520"></canvas></div>
      <button id="spinBtn" class="btn big">🔮 Çarxı fırlat</button>
      <p class="hint" id="hint"></p>
    </div>
  </section>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-card">
    <div class="confetti">🎉</div>
    <h3>Təbriklər!</h3>
    <p class="win" id="winTxt"></p>
    <p class="sub" id="winCat"></p>
    <p class="sub">Kupon "Kuponlarım" bölməsinə əlavə olundu.</p>
    <div class="row">
      <a class="btn ghost" href="profile.html">Kuponlarım</a>
      <button class="btn" id="closeModal">Bağla</button>
    </div>
  </div>
</div>

<footer class="ftr">
  <div class="ftr-logo">Misterio</div>
  <div>info@misterio.az · +994 70 562 12 69</div>
  <div class="small">Bütün hüquqlar qorunur © 2026 Misterio</div>
</footer>
<script src="db.js"></script>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="spin.js"></script>
</body>
</html>
