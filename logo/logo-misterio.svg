<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="38" height="38" aria-hidden="true">
  <!-- ağ dairəvi fon -->
  <circle cx="120" cy="120" r="118" fill="#ffffff"/>
  <circle cx="120" cy="120" r="118" fill="none" stroke="#e9d5ff" stroke-width="2"/>
  <g fill="none" stroke="#2e1065">
    <circle cx="120" cy="120" r="110" stroke-width="2.4"/>
    <circle cx="120" cy="120" r="102" stroke-width="1.1"/>
    <!-- 6-point star (hexagram) -->
    <g stroke-width="1.1" opacity="0.5">
      <polygon points="120,54 154,131 86,131"/>
      <polygon points="120,186 86,109 154,109"/>
    </g>
  </g>
  <!-- sadəcə Misterio sözü, sual işarəsi və < > YOX -->
  <text x="120" y="130" fill="#2e1065" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="30" text-anchor="middle">Misterio</text>
</svg>
