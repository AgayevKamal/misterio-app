<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="38" height="38" fill="none" stroke="currentColor">
  <!-- outer double ring -->
  <circle cx="120" cy="120" r="112" stroke-width="2.4"/>
  <circle cx="120" cy="120" r="104" stroke-width="1.1"/>
  <!-- 6-point star (hexagram) -->
  <g stroke-width="1.1" opacity="0.5">
    <polygon points="120,52 156,131 84,131"/>
    <polygon points="120,188 84,109 156,109"/>
  </g>
  <!-- 8 question marks -->
  <g fill="currentColor" stroke="none" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="15" text-anchor="middle" opacity="0.55">
    <text x="120" y="36">?</text>
    <text x="178" y="56">?</text>
    <text x="204" y="112">?</text>
    <text x="190" y="170">?</text>
    <text x="150" y="204">?</text>
    <text x="90"  y="204">?</text>
    <text x="50"  y="170">?</text>
    <text x="36"  y="112">?</text>
  </g>
  <!-- center word -->
  <text x="120" y="129" fill="currentColor" stroke="none" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="28" text-anchor="middle">&lt; Misterio &gt;</text>
</svg>
