<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="38" height="38">
  <!-- ağ dairəvi fon (həm tünd, həm açıq fonda aydın görünsün) -->
  <circle cx="120" cy="120" r="118" fill="#ffffff"/>
  <circle cx="120" cy="120" r="118" fill="none" stroke="#e9d5ff" stroke-width="2"/>
  <g fill="none" stroke="#2e1065">
    <!-- outer double ring -->
    <circle cx="120" cy="120" r="110" stroke-width="2.4"/>
    <circle cx="120" cy="120" r="102" stroke-width="1.1"/>
    <!-- 6-point star (hexagram) -->
    <g stroke-width="1.1" opacity="0.5">
      <polygon points="120,54 154,131 86,131"/>
      <polygon points="120,186 86,109 154,109"/>
    </g>
  </g>
  <!-- 8 question marks -->
  <g fill="#9f7aea" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="15" text-anchor="middle">
    <text x="120" y="38">?</text>
    <text x="176" y="58">?</text>
    <text x="202" y="112">?</text>
    <text x="188" y="170">?</text>
    <text x="150" y="202">?</text>
    <text x="90"  y="202">?</text>
    <text x="52"  y="170">?</text>
    <text x="38"  y="112">?</text>
  </g>
  <!-- center word -->
  <text x="120" y="129" fill="#2e1065" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="27" text-anchor="middle">&lt; Misterio &gt;</text>
</svg>
